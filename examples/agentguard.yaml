# Starter policy: every new organization begins here.
#
# It wires up two demo connectors (an in-memory payments system and outbox)
# so you can try the full flow before connecting real systems. Edit it under
# Policies; each save creates a new version you can diff and roll back.
#
# How decisions work: every matching rule is collected and the most
# restrictive decision wins (block > review > allow). If nothing matches,
# `default` applies, so anything not explicitly allowed is blocked.

description: Customer-support agent guardrails (starter)
approval_ttl_seconds: 86400
redact_params: [card_number, ssn, password]

connectors:
  payments:
    type: mock_payments
    description: Demo payments backend. Replace with the stripe connector below.
  email:
    type: mock_email
    description: Demo outbox

  # Real Stripe refunds: store your restricted key under Secrets as
  # `stripe_key`, uncomment this block, and point rules at stripe.refund.
  # stripe:
  #   type: stripe
  #   secret: stripe_key

policies:
  default: block

  rules:
    - id: support-read
      description: Support agents may look up customers
      agents: ["support-*"]
      action: payments.get_customer
      decision: allow

    - id: refund-small
      description: Small refunds go through automatically
      agents: ["support-*"]
      action: payments.refund
      when: {amount: {gt: 0, lte: 50}}
      decision: allow

    - id: refund-medium
      description: Refunds between $50 and $500 need one approver
      agents: ["support-*"]
      action: payments.refund
      when: {amount: {gt: 50, lte: 500}}
      decision: review
      reason: Refunds over $50 require manager approval

    - id: refund-large
      description: Refunds between $500 and $2,000 need two different admins
      agents: ["support-*"]
      action: payments.refund
      when: {amount: {gt: 500, lte: 2000}}
      decision: review
      reason: Refunds over $500 require two admins
      approvals: {min: 2, roles: [owner, admin]}

    - id: refund-huge
      description: Nothing above $2,000 is ever automated
      action: payments.refund
      when: {amount: {gt: 2000}}
      decision: block
      reason: Refunds over $2,000 must be handled by the finance team

    - id: email-customers
      description: Support may send email to well-formed addresses
      agents: ["support-*"]
      action: email.send
      when: {to: {regex: "^[^@\\s]+@[^@\\s]+\\.[a-z]{2,}$"}}
      decision: allow

  rate_limits:
    - id: refund-burst
      description: Stop a looping agent before it drains the account
      action: payments.refund
      max: 5
      window_seconds: 60
      pause_agent: true

    - id: email-burst
      action: email.send
      max: 20
      window_seconds: 60
