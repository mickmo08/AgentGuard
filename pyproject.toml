[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard"
version = "0.1.0"
description = "Action gateway for AI agents: credential brokering, policy enforcement, human approvals and a tamper-evident audit log."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "sqlalchemy>=2.0",
  "pyyaml>=6.0",
]
dev = ["pytest>=8", "agentguard[server]"]

[project.scripts]
agentguard = "agentguard.cli:main"

[tool.setuptools.packages.find]
include = ["agentguard*"]

[tool.setuptools.package-data]
"agentguard.server" = ["dashboard.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
