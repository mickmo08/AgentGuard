[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentguard"
version = "0.2.0"
description = "Action gateway for AI agents: credential brokering, policy enforcement, human approvals and a tamper-evident audit log."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
  "httpx>=0.27",
]

[project.optional-dependencies]
server = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pyyaml>=6.0",
  "cryptography>=42",
  "prometheus-client>=0.20",
  "psycopg[binary]>=3.1",
]
mcp = ["mcp>=2.0", "anyio>=4"]
dev = ["agentguard[server,mcp]", "pytest>=8", "ruff>=0.5"]

[project.scripts]
agentguard = "agentguard.cli:main"

[tool.setuptools.packages.find]
include = ["agentguard*"]

[tool.setuptools.package-data]
"agentguard.server" = ["static/*", "starter_policy.yaml"]
"agentguard" = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 160
target-version = "py310"
extend-exclude = ["agentguard/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "UP007", "UP045"]
